name: ci-backend

# On push to main: only if backend files (or this workflow) change. On PRs: always.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  # No paths filter here: a required check must run on every PR,
  # otherwise PRs that don't touch backend/ would wait forever.
  pull_request:

# Least privilege: this workflow only needs to read the code
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Every "run" step starts inside backend/, where go.mod lives
    defaults:
      run:
        working-directory: backend

    steps:
      # Download the repo code into the runner
      - uses: actions/checkout@v4

      # Install the same Go version declared in go.mod.
      # "uses" steps ignore working-directory, so paths start at the repo root.
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Fail if any file is not gofmt-formatted
      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      # -race catches data races (important for the future worker pool)
      - name: Test
        run: go test -race ./...
        
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Runs golangci-lint using backend/.golangci.yml
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend

  vulncheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # "go run pkg@version" runs the tool without adding it to go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build the same image the deploy will use. This alone proves the
      # Dockerfile still works.
      - name: Build the API image
        run: docker build -t aktenlens-api:ci backend

      # Fail only on CRITICAL vulnerabilities that already have a fix.
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aktenlens-api:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
