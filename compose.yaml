services:
  postgres:
    # Pinned tag: never use "latest", the database version must not change by surprise.
    image: pgvector/pgvector:pg16
    container_name: aktenlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # host:container. Bound to 127.0.0.1 so only this machine can connect.
      # The host port is not 5432 because a local PostgreSQL may already use it.
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      # For the pg16 image the data directory is /var/lib/postgresql/data.
      - aktenlens-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # $$ stops Compose from replacing the variable: the container's own
      # environment (not the host's .env) is used when the check runs.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    # Built from backend/Dockerfile (the build context is the backend/ folder).
    build: ./backend
    container_name: aktenlens-api
    restart: unless-stopped
    environment:
      # Inside the Compose network the database host is the service name
      # "postgres" and the port is the container port (5432), not the
      # 127.0.0.1:5433 used from your own machine.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      # The local Compose stack is plain HTTP (no HTTPS), and browsers do not
      # keep a Secure cookie there. In production this stays unset (= true).
      COOKIE_SECURE: "false"
    ports:
      # Bound to 127.0.0.1 so only this machine can reach the API.
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  aktenlens-postgres-data:
